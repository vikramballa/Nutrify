name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so every migration is applied on each push and the
    # database tests (apps/api/test/db) run against it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrichef
          POSTGRES_PASSWORD: nutrichef
          POSTGRES_DB: nutrichef
          # Not UTC on purpose: raw SQL that depends on the session time zone
          # passes on a UTC server and breaks on a developer's local one.
          TZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrichef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nutrichef:nutrichef@localhost:5432/nutrichef
      DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm exec -w apps/api -- prisma generate

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Apply migrations
        run: npm exec -w apps/api -- prisma migrate deploy

      - name: Schema matches migrations
        # Fails when schema.prisma changed without a migration (or vice versa).
        run: npm exec -w apps/api -- prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck (all workspaces)
        run: |
          npm run typecheck -w packages/shared
          npm run typecheck -w apps/api
          npm run typecheck -w apps/mobile --if-present

      - name: Test (all workspaces)
        run: npm test
