services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrichef-db
    restart: unless-stopped
    # pg_stat_statements records every query's time and call count, so slow
    # ones can be found with numbers (see README, "Database"); statements over
    # 200 ms are also written to the server log.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
    environment:
      POSTGRES_USER: nutrichef
      POSTGRES_PASSWORD: nutrichef
      POSTGRES_DB: nutrichef
    ports:
      # Host port defaults to 5432; override with DB_PORT if it's already in use.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nutrichef-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrichef"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nutrichef-pgdata:
